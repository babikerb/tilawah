name: iOS Build (local on macOS runner)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # expo-modules-jsi's Package.swift declares `swift-tools-version: 6.2`,
      # so it needs Xcode 26.x to even resolve its manifest — Xcode 16.x fails
      # with "Could not resolve package dependencies". latest-stable is safe
      # again now that patches/expo-modules-jsi+57.1.1.patch (applied via the
      # postinstall hook) fixes the separate SWIFT_RETURNS_RETAINED compile
      # error that newer Swift 6.2 compilers hit on the unpatched header
      # (see expo/expo#50067 — still open/unfixed upstream as of SDK 58).
      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS (.ipa) locally on the macOS runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COCOAPODS_DISABLE_STATS: true
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/tilawah-${{ github.event.inputs.profile }}.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawah-${{ github.event.inputs.profile }}-ipa
          path: ${{ github.workspace }}/tilawah-*.ipa
          if-no-files-found: error
          retention-days: 14
