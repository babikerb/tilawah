name: iOS Build (local on macOS runner)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # expo-modules-jsi (bundled with every Expo SDK 57/58 app) is caught
      # between two Xcode generations right now — see expo/expo#50067:
      #   - Xcode 26.3+ (Swift 6.2+): RuntimeScheduler.h fails to compile
      #     ("cannot be annotated with SWIFT_RETURNS_RETAINED... not a
      #     SWIFT_SHARED_REFERENCE type"). Confirmed still broken in the
      #     latest expo-modules-jsi (58.0.4) too — no patched version exists yet.
      #   - Xcode 16.x: can't resolve expo-modules-jsi's Package.swift at all
      #     ("Could not resolve package dependencies"), since it declares
      #     `swift-tools-version: 6.2`, which only 26.x toolchains understand.
      # 26.1 is the newest release before the stricter Swift 6.2.3+/26.2+
      # diagnostic was reportedly introduced, so it's the one version that
      # might satisfy both constraints — unconfirmed, revisit if this still
      # fails. EAS's own hosted cloud builders sidestep this entirely (older
      # Swift), which is the fallback if no local Xcode version works.
      - name: Select Xcode 26.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS (.ipa) locally on the macOS runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COCOAPODS_DISABLE_STATS: true
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/tilawah-${{ github.event.inputs.profile }}.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawah-${{ github.event.inputs.profile }}-ipa
          path: ${{ github.workspace }}/tilawah-*.ipa
          if-no-files-found: error
          retention-days: 14
